# Modules whose functions Python users replace at runtime; each gets an `overrides` object.
overridable: [api.owner.settings]
# JS reserved words that are valid Python names get a trailing underscore.
reserved: [new, class, function, var, default, delete, this, switch, case, const, let, enum, export, import, typeof, void, with, package, interface, private, protected, public, static, arguments, eval, instanceof, do, catch, extends, super, debugger, implements]
# Python modules with a hand-written counterpart in src/ts/ifcopenshell-js/src/python: `import x as y` and
# `from x import z` refer to `alias.member` of that module, with camelCase members.
# math has no module; its names map through math_functions and math_constants.
runtime_modules:
  math: {module: null}
  datetime: {module: util._datetime, alias: datetime}
  isodate: {module: util._isodate, alias: isodate}
  dateutil: {module: util._dateutil, alias: dateutil}
  numpy: {module: util._numpy, alias: np}
  os: {module: util._os, alias: os}
  re: {module: util._py, alias: py, prefix: re, plain_import: false}
  itertools: {module: util._itertools, alias: itertools}
# Runtime modules whose objects overload Python operators; in modules importing them,
# operators and subscripts on values of unknown type dispatch at runtime.
overloading_modules: [datetime, isodate, dateutil, numpy]
# Kind of values returned by runtime module functions; see `inference`.
runtime_kinds:
  numpy: ndarray
  datetime: pyobject
  isodate: pyobject
  dateutil: pyobject
# numpy functions that return Python scalars or booleans rather than arrays.
numpy_scalars: [norm, dot, allclose, isclose, any, all, sum, min, max, mean, argmax, argmin, sign, abs, round, isnan, isinf, cos, sin, arctan, arcsin, arccos, radians, degrees, float64, float32, int64, int32]
# Python arithmetic operators and their runtime functions for overloaded operands.
dunder_operators:
  Add: add
  Sub: sub
  Mult: mul
  Div: truediv
  FloorDiv: floordiv
  Mod: mod
  Pow: pow
  MatMult: matmul
# Imported modules that rules translate (others are dropped and their users stubbed).
supported_modules: [math, json, time, functools, typing, collections, namedtuple, defaultdict, re, pathlib, assert_never, typing_extensions, dataclasses, dataclass, field]
# Modules imported only for annotations.
type_only_modules: [typing, typing_extensions, collections.abc, __future__, collections, functools]
# Functions that introspect Python itself; generate.py runs them for each argument and
# the generated function looks the result up. Arguments must be strings.
precomputed:
  util.type.get_correct_type_assigned_rules: [IFC2X3, IFC4, IFC4X3, IFC4X3_ADD2]
precomputed_function: |
  const {{ name | camel }}Data: Record<string, any> = {{ data | literal }};

  /** Precomputed from Python by src/transpiler/generate.py for {{ data.keys() | join(", ") }}. */
  export function {{ name | camel }}({{ parameter }}: string): any {
    if (!({{ parameter }} in {{ name | camel }}Data)) throw new Error(`{{ name }}: no precomputed result for ${ {{- parameter -}} }`);
