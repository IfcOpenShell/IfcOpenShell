  - input: *id001
    when: op.__class__.__name__ in ["Eq", "NotEq"] and (left | kind == "array" or right | kind == "array")
    output: '{% if op.__class__.__name__ == "NotEq" %}!{% endif %}({{ left | emit }}.length === {{ right | emit }}.length && {{ left | emit }}.every((value: any, index: number) => value === {{ right | emit }}[index]))'
  - input:
      node: Compare
      left: $left
      ops:
        - $op
      comparators:
        - $right
    when: op.__class__.__name__ in ["Eq", "NotEq", "Is", "IsNot", "Gt", "Lt", "GtE", "LtE"]
    output: ({{ left | emit }} {{ {"Eq":"===", "NotEq":"!==", "Is":"===", "IsNot":"!==", "Gt":">", "Lt":"<", "GtE":">=", "LtE":"<="}[op.__class__.__name__] }} {{ right | emit }})
  - input:
      node: Compare
      left: $left
      ops: $ops
      comparators: $comparators
    when: ops | length > 1 and ops | map(attribute="__class__.__name__") | reject("in", ["Gt", "Lt", "GtE", "LtE", "Eq", "NotEq"]) | list | length == 0
    output: '({% for op in ops %}{{ (left if loop.first else comparators[loop.index0 - 1]) | emit }} {{ {"Eq":"===", "NotEq":"!==", "Gt":">", "Lt":"<", "GtE":">=", "LtE":"<="}[op.__class__.__name__] }} {{ comparators[loop.index0] | emit }}{% if not loop.last %} && {% endif %}{% endfor %})'
  - input:
      node: Dict
      keys: $keys
      values: $values
    when: node | kind == "map"
    output: 'new {{ "util._py" | use("py") }}.PyDict([{% for key in keys %}[{{ key | emit }}, {{ values[loop.index0] | emit }}]{% if not loop.last %}, {% endif %}{% endfor %}])'
  - input:
      node: Dict
      keys: $keys
      values: $values
    output: '({ {% for key in keys %}{% if key.value is defined and key.value is string %}{{ key.value | literal }}{% else %}[{{ key | emit }}]{% endif %}: {{ values[loop.index0] | emit }}{% if not loop.last %}, {% endif %}{% endfor %} })'
  - input:
      node: Tuple
      elts: $elements
    output: '[{{ elements | map("emit") | join(", ") }}]'
  - input:
      node: List
      elts: $elements
    output: '[{{ elements | map("emit") | join(", ") }}]'
  - input:
      node: Starred
      value: $value
    output: '...{{ value | emit }}'
  - input:
      node: Yield
      value: $value
    output: yielded.push({{ value | emit }})
  - input:
      node: YieldFrom
      value: $value
    output: yielded.push(...{{ value | iterable }})
  - input:
      node: Constant
    when: node.value.__class__.__name__ == "ellipsis"
    output: undefined
  - input:
      node: Constant
      value: $value
    output: '{{ value | literal }}'
  - input:
      node: Name
      id: $name
      ctx:
        node: Load
    when: name in builtin_values and name not in shadowed and name not in module_globals
    output: '{{ builtin_values[name] }}'
  - input:
      node: Name
      id: __file__
    output: import.meta.url
  - input:
      node: Attribute
      value:
        node: Name
        id: re
      attr: $flag
    when: flag in ["I", "IGNORECASE", "M", "MULTILINE", "S", "DOTALL"]
    output: '{{ "util._py" | use("py") }}.re.{{ flag }}'
  # In overridable modules, a function read as a value is its override, if one is set.
  - input:
      node: Name
      id: $name
      ctx:
        node: Load
    when: this_module in overridable and name in functions and name not in shadowed
    output: '(overrides.{{ name | camel }} ?? {{ name | camel }})'
  - input:
      node: Name
      id: $name
    when: node | resolve is not none
    output: '{% set q = node | resolve %}{% if q.rsplit(".", 1)[0] == this_module %}{{ name | camel }}{% else %}{{ q.rsplit(".", 1)[0] | use }}.{{ q.rsplit(".", 1)[1] | camel }}{% endif %}'
  - input:
      node: Name
      id: $name
    output: '{{ names.get(name, name | ident) }}'
  - input: $operator
    when: operator.__class__.__name__ in operators
    output: '{{ operators[operator.__class__.__name__] }}'
parameter_types:
  - input:
      node: arg
      annotation: $annotation
    # String Literal parameters accept any string: callers pass str values (file.schema(), ...); set
    # parameters accept any iterable, as callers pass lists.
    output: '{{ "any" if node.widened is defined else "string" if annotation is not none and (annotation.id is defined and annotation.id in aliases or annotation | emit("annotation_kinds") == "string" and annotation | source != "str") else ("Iterable<" ~ (annotation.slice | type) ~ ">") if annotation.__class__.__name__ == "Subscript" and annotation.value | source == "set" else annotation | type }}'
annotation_kinds:
  - input: $value
    when: value | alias_value is not none
    output: '{{ value | alias_value | emit("annotation_kinds") }}'
  - input: $value
    when: value is not none and value | source in ["npt.NDArray", "NDArray", "np.ndarray", "numpy.ndarray"]
    output: ndarray
  - input:
      node: Subscript
      value: $array
    when: array | source in ["npt.NDArray", "NDArray"]
    output: ndarray
  - input: $value
    when: value | runtime_path is not none and (value | runtime_path).module in runtime_kinds
    output: '{% set path = value | runtime_path %}{{ "ndarray" if path.module == "numpy" and path.parts[-1] in ["ndarray", "NDArray", "array"] else "number" if path.module == "numpy" else runtime_kinds[path.module] }}'
  - input:
      node: Name
      id: $name
    output: '{{ {"str":"string", "float":"number", "int":"number", "bool":"boolean", "DimensionalExponents":"array", "MEASURE_CLASS":"string", "QUANTITY_CLASS":"string"}.get(name, "unknown") }}'
  - input:
      node: Subscript
      value:
        node: Name
        id: Optional
      slice: $element
    output: '{{ element | emit("annotation_kinds") }}'
  - input:
      node: Subscript
      value:
        node: Name
        id: $name
      slice:
        node: Tuple
        elts: $elements
    when: name in ["dict", "defaultdict", "Mapping", "MutableMapping"]
    output: '{{ "dict" if elements[0].id is defined and elements[0].id == "str" or elements[0].value is defined and elements[0].value is string or elements[0] | emit("annotation_kinds") == "string" else "map" }}'
  - input:
      node: Subscript
      value:
        node: Name
        id: Literal
      slice: $values
    when: (values.elts if values.elts is defined else [values]) | rejectattr("value", "string") | list | length == 0
    output: string
  - input:
      node: Subscript
      value:
        node: Name
        id: $name
    output: '{{ {"list":"array", "tuple":"array", "dict":"dict", "set":"set", "Sequence":"array"}.get(name,"unknown") }}'
  - input:
      node: Attribute
      attr: $name
    output: '{{ {"entity_instance": "entity", "file": "file"}.get(name, "unknown") }}'
  - input:
      node: BinOp
      left: $left
      right:
        node: Constant
        value: null
    output: '{{ left | emit("annotation_kinds") }}'
  - input: $value
    output: unknown
inference:
  - input:
      node: Call
      func: $callee
    when: callee | runtime_path is not none
    output: '{% set path = callee | runtime_path %}{% set name = path.parts[-1] if path.parts else "" %}{% if path.module == "math" %}number{% elif path.module == "numpy" %}{{ "boolean" if name in ["allclose", "array_equal"] else "unknown" if name in numpy_scalars else "ndarray" }}{% elif path.module == "itertools" %}array{% else %}{{ runtime_kinds.get(path.module, "unknown") }}{% endif %}'
  - input: $value
    when: value.__class__.__name__ in ["Name", "Attribute"] and value | runtime_path is not none
    output: '{% set path = value | runtime_path %}{{ "number" if path.module == "math" or path.module == "numpy" and path.parts[-1] in ["pi", "e", "inf", "nan"] else "unknown" }}'
  - input:
      node: Name
      id: $name
    output: '{{ symbols.get(name, "unknown") }}'
  - input:
      node: Attribute
      value:
        node: Name
        id: self
      attr: $attr
    when: ("self." ~ attr) in symbols
    output: '{{ symbols["self." ~ attr] }}'
  # Values of annotated dicts: d.get(k), d.setdefault(k, v), d[k], at any depth.
  - input: $value
    when: value.__class__.__name__ in ["Call", "Subscript"] and value | path in symbols
    output: '{{ symbols[value | path] }}'
  - input:
      node: Constant
      value: $value
    output: '{{ "string" if value is string else "boolean" if value is boolean else "number" if value is number else "unknown" }}'
  - input:
      node: BinOp
      left: $left
      op: $op
      right: $right
    when: op.__class__.__name__ in dunder_operators and (left | kind in ["ndarray", "pyobject"] or right | kind in ["ndarray", "pyobject"])
    output: '{{ "ndarray" if "ndarray" in [left | kind, right | kind] else "pyobject" }}'
  - input:
      node: UnaryOp
      op:
        node: USub
      operand: $value
    when: value | kind in ["ndarray", "pyobject", "number"]
    output: '{{ value | kind }}'
  - input:
      node: Attribute
      value: $value
      attr: $attr
    when: attr in ["T", "real", "imag"] and value | kind == "ndarray"
    output: ndarray
  - input:
      node: Subscript
      value: $value
      slice: $index
    when: value | kind == "ndarray" and (index.__class__.__name__ == "Slice" or index.__class__.__name__ == "Tuple" and index.elts | selectattr("__class__.__name__", "equalto", "Slice") | list)
    output: ndarray
  - input:
      node: Call
      func:
        node: Attribute
        value: $value
        attr: $method
    when: value | kind in ["ndarray", "pyobject"]
    output: '{% if value | kind == "ndarray" %}{{ "array" if method == "tolist" else "ndarray" if method in ["copy", "reshape", "flatten", "ravel", "transpose", "astype", "round", "cross", "clip"] else "unknown" }}{% else %}{{ "string" if method in ["isoformat", "strftime", "isoformat", "ctime"] else "number" if method in ["timestamp", "total_seconds", "weekday", "isoweekday", "toordinal"] else "pyobject" if method in ["date", "time", "replace", "combine", "astimezone", "now", "today"] else "unknown" }}{% endif %}'
  - input: $value
    when: value is not none and value.__class__.__name__ in ["List", "Tuple", "ListComp", "GeneratorExp"]
    output: array
  - input:
      node: Dict
      keys: $keys
    when: keys and (keys | reject("none") | selectattr("__class__.__name__", "equalto", "Tuple") | list or keys | reject("none") | map("kind") | select("in", ["entity", "number"]) | list)
    output: map
  - input:
      node: DictComp
      key: $key
    when: key.__class__.__name__ == "Tuple" or key | kind in ["entity", "number"]
    output: map
  - input:
      node: Call
      func:
        node: Name
        id: defaultdict
    output: map
  - input: $value
    when: value is not none and value.__class__.__name__ in ["Dict", "DictComp"]
    output: dict
  - input:
      node: NamedExpr
      value: $value
    output: '{{ value | kind }}'
  - input:
      node: Call
      func:
        node: Name
        id: $name
    when: name in classes
    output: class:{{ name }}
  - input:
      node: Call
      func:
        node: Name
        id: $name
    when: name in ["hasattr", "isinstance", "bool", "len", "int", "float", "set", "sum", "sorted", "all", "any", "round", "frozenset"]
    output: '{{ {"hasattr": "boolean", "isinstance": "boolean", "bool": "boolean", "len": "number", "int": "number", "float": "number", "set": "set", "sum": "number", "sorted": "array", "all": "boolean", "any": "boolean", "round": "number", "frozenset": "set"}[name] }}'
  - input:
      node: Call
      func:
        node: Attribute
        attr: $method
      args: $args
    when: method in ["is_a", "get_inverse", "startswith", "endswith", "id", "get_total_inverses", "create_entity", "get_info"] or method.startswith("createIfc")
    output: '{{ "string" if method == "is_a" and not args else "boolean" if method in ["is_a", "startswith", "endswith"] else "set" if method == "get_inverse" else "number" if method in ["id", "get_total_inverses"] else "dict" if method == "get_info" else "entity" }}'
  - input: $value
    when: value.__class__.__name__ in ["Compare", "UnaryOp"] and (value.__class__.__name__ == "Compare" or value.op.__class__.__name__ == "Not")
    output: boolean
  - input: $value
    when: value.__class__.__name__ in ["Set", "SetComp"]
    output: set
  - input:
      node: BinOp
      left: $left
      op: $op
      right: $right
    when: op.__class__.__name__ in ["BitOr", "Sub", "BitAnd"] and (left | kind == "set" or right | kind == "set")
    output: set
  - input:
      node: BinOp
      left: $left
      op:
        node: Add
      right: $right
    when: left | kind == "array" or right | kind == "array"
    output: array
  - input: $value
    when: value.__class__.__name__ == "JoinedStr"
    output: string
  - input:
      node: BoolOp
      values: $values
    output: '{{ values[-1] | kind }}'
  - input:
      node: Attribute
      attr: units
    output: dict
  - input:
      node: Attribute
      attr: $attr
    when: attr in ["Units", "Elements", "DefiningValues", "DefinedValues"]
    output: array
  - input:
      node: Call
      func:
        node: Attribute
        attr: $method
    when: method in ["by_type", "keys", "items", "upper", "lower", "replace", "capitalize", "join"]
    output: '{{ "array" if method in ["by_type", "keys", "items"] else "string" }}'
  - input:
      node: Call
      func: $callee
    when: callee | signature is not none
    output: '{{ (callee | signature).returns | emit("annotation_kinds") }}'
  - input:
      node: Call
      func:
        node: Name
        id: $name
    when: name in ["tuple", "list", "range", "str"]
    output: '{{ "array" if name in ["tuple", "list", "range"] else "string" }}'
  - input: $value
    output: unknown
