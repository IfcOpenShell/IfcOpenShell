ignored_decorators: [functools.cache, functools.lru_cache, cache, lru_cache, staticmethod]
# Python methods whose JS name or semantics differ; calls to them need an explicit rule.
python_methods: [pop, insert, sort, reverse, format, title, setdefault, values, items, keys, get, find, rfind, partition, zfill, center, ljust, rjust, isdigit, isalpha, isnumeric, swapcase, casefold, splitlines, encode, decode, clear, union, intersection, difference, issubset, issuperset, popitem, fromkeys, append, extend, copy, update, split, join, strip, lstrip, rstrip, upper, lower, replace, startswith, endswith, count, index, remove, add, discard]
