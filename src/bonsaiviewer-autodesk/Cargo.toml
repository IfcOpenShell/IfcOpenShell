[package]
name = "bonsaiviewer-autodesk"
version = "0.1.0"
edition = "2021"
description = "Autodesk cloud connector for Bonsai Viewer"
license = "LGPL-3.0-or-later"

[lib]
name = "bonsaiviewer_autodesk"
path = "src/lib.rs"

[[bin]]
name = "bonsaiviewer-autodesk"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.10", features = ["json", "tls", "native-certs"], default-features = false }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
dirs = "5"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
url = "2"
webbrowser = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
fltk = { version = "1.5", features = ["fltk-bundled"] }
fltk-theme = "0.7"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
