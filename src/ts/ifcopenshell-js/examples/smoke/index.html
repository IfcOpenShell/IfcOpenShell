<body>
  <p><a href="../index.html">← All chapters</a></p>
  <h1>ifcopenshell — smoke</h1>
  <p>
    Loads <code>ifcopenshell</code> and WASM from the CDN. Create a tiny IFC4 model in memory,
    or open a local <code>.ifc</code> file. The schema plugin is chosen from <code>FILE_SCHEMA</code>.
  </p>
  <button id="create" type="button" disabled>Create demo IFC4 wall</button>
  <input id="file" type="file" accept=".ifc,application/octet-stream" disabled />
  <pre id="log">Initializing WASM…</pre>

  <script type="module">
    import * as ifcopenshell from 'ifcopenshell';

    const logEl = document.getElementById('log');
    const createBtn = document.getElementById('create');
    const fileInput = document.getElementById('file');
    const STD = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/';
    const IFC = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz_$';

    function log(message, className = '') {
      logEl.textContent = message;
      logEl.className = className;
    }

    function newGuid() {
      const hex = `0000${crypto.randomUUID().replace(/-/g, '')}`;
      const bytes = new Uint8Array(hex.length / 2);
      for (let i = 0; i < bytes.length; i++) bytes[i] = Number.parseInt(hex.slice(i * 2, i * 2 + 2), 16);
      let binary = '';
      for (const byte of bytes) binary += String.fromCharCode(byte);
      return [...btoa(binary).slice(2)].map((char) => IFC[STD.indexOf(char)]).join('');
    }

    function schemaPluginId(runtime, bytes) {
      const preview = new TextDecoder().decode(bytes.slice(0, 4096));
      const stream = runtime.raw.parse.streamFromString(preview);
      if (!stream) throw new Error('Could not read the IFC header');
      let header;
      let declaration;
      try {
        header = stream.header();
        declaration = header?.fileSchema();
        const identifier = declaration?.schemaIdentifiers()?.[0];
        if (!identifier) throw new Error('FILE_SCHEMA is missing');
        return identifier.toLowerCase();
      } finally {
        declaration?.destroy();
        header?.destroy();
        stream.destroy();
      }
    }

    function summarize(model) {
      const walls = model.byType('IfcWall');
      const names = walls.map((wall) => wall.Name ?? '(unnamed)');
      return [
        `schema: ${model.schema()} (${model.schemaIdentifier()})`,
        `IfcWall count: ${walls.length}`,
        `IfcWall names: ${names.join(', ') || '(none)'}`,
      ].join('\n');
    }

    let runtime;
    try {
      runtime = await ifcopenshell.init();
      log('Ready. Create a demo model or choose an .ifc file.', 'ok');
      createBtn.disabled = false;
      fileInput.disabled = false;
    } catch (error) {
      log(`init() failed:\n${error?.stack || error}`, 'err');
      throw error;
    }

    createBtn.addEventListener('click', async () => {
      createBtn.disabled = true;
      try {
        log('Creating IFC4 file…');
        if (!runtime.loadedPlugins().includes('schema:ifc4')) {
          await runtime.loadPlugin('schema', 'ifc4');
        }
        const model = new ifcopenshell.File('IFC4');
        try {
          model.create('IfcWall', { GlobalId: newGuid(), Name: 'Demo Wall' });
          log(summarize(model), 'ok');
        } finally {
          model.dispose();
        }
      } catch (error) {
        log(`create failed:\n${error?.stack || error}`, 'err');
      } finally {
        createBtn.disabled = false;
      }
    });

    fileInput.addEventListener('change', async () => {
      const file = fileInput.files?.[0];
      if (!file) return;
      fileInput.disabled = true;
      try {
        log(`Opening ${file.name}…`);
        const bytes = new Uint8Array(await file.arrayBuffer());
        const pluginId = schemaPluginId(runtime, bytes);
        if (!runtime.loadedPlugins().includes(`schema:${pluginId}`)) {
          await runtime.loadPlugin('schema', pluginId);
        }
        const model = ifcopenshell.open(bytes, file.name);
        try {
          log(summarize(model), 'ok');
        } finally {
          model.dispose();
        }
      } catch (error) {
        log(`open failed:\n${error?.stack || error}`, 'err');
      } finally {
        fileInput.value = '';
        fileInput.disabled = false;
      }
    });
  </script>
