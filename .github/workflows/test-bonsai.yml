name: Test Bonsai

on:
  pull_request:
  workflow_dispatch:

# A new push to the same pull request cancels the run still going for its previous commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BLENDER_VERSION: 5.2.0
  PYVERSION: py313

jobs:
  detect-bonsai-changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read  # paths-filter lists the PR's files through the API, no checkout needed
    outputs:
      should_run: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.bonsai == 'true' }}
    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            bonsai:
              - '.github/workflows/test-bonsai.yml'
              # Bonsai itself, then every package whose wheel `make dist` bundles into it.
              - 'src/bonsai/**'
              - 'src/ifcopenshell-python/**'
              - 'src/bcf/**'
              - 'src/bsdd/**'
              - 'src/ifc4d/**'
              - 'src/ifc5d/**'
              - 'src/ifccityjson/**'
              - 'src/ifcclash/**'
              - 'src/ifccsv/**'
              - 'src/ifcdiff/**'
              - 'src/ifcfm/**'
              - 'src/ifcpatch/**'
              - 'src/ifctester/**'

  test-bonsai:
    runs-on: ubuntu-latest
    needs: detect-bonsai-changes
    if: needs.detect-bonsai-changes.outputs.should_run == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Build the Bonsai extension from this checkout
        run: |
          cd src/bonsai && make dist PLATFORM=linux PYVERSION=${{ env.PYVERSION }}
          ls -la dist

      - name: Download Blender
        run: |
          wget -q -O blender.tar.xz "https://download.blender.org/release/Blender${BLENDER_VERSION%.*}/blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          tar -xf blender.tar.xz
          echo "$(readlink -f blender-*/)" >> "$GITHUB_PATH"

      - name: Install the extension
        run: |
          set -x -e
          blender --version
          blender --command extension install-file -r user_default -e "$(ls src/bonsai/dist/bonsai_*-linux-x64.zip)"
          blender --command extension list
          # Registration errors only surface outside background mode; the daily build checks this too.
          blender --background --python-exit-code 1 --python src/bonsai/scripts/reregister_bonsai.py
          # Sun Position is a test dependency.
          blender --online-mode --command extension sync
          blender --online-mode --command extension install --enable --sync sun_position

      - name: Smoke-test ifcsverchok
        # ifcsverchok has no test suite; this checks that it still builds, installs
        # next to Bonsai and enables. It needs sverchok itself, fetched from master.
        run: |
          set -x -e
          wget -q -O sverchok.zip https://github.com/nortikin/sverchok/archive/refs/heads/master.zip
          # ifcsverchok expects the extension to be named "sverchok", not "sverchok-master".
          unzip -q sverchok.zip
          mv sverchok-master sverchok
          zip -q -r sverchok.zip sverchok
          rm -r sverchok
          blender --command extension install-file -r user_default sverchok.zip

          cd src/ifcsverchok
          make dist
          blender --command extension install-file -r user_default "$(pwd)/dist/$(ls dist)"
          blender --command extension list

      - name: Set up pytest inside Blender
        run: |
          set -x -e
          cd src/bonsai
          # `--group` needs pip 25.1+.
          python -m pip install --upgrade pip
          pip install --group dev
          blender --background --python-exit-code 1 --python scripts/setup_pytest.py
          blender --background --python-exit-code 1 --python-expr "import bonsai; print(bonsai.bbim_semver); import ifcopenshell; print(ifcopenshell.version)"

      - name: test-core
        run: cd src/bonsai && make test-core

      - name: test-tool
        if: ${{ !cancelled() }}
        run: cd src/bonsai && make test-tool

      - name: test-bim
        if: ${{ !cancelled() }}
        run: cd src/bonsai && make test-bim
