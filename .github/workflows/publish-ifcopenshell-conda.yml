name: Publish IfcOpenShell Conda

permissions: {}

on:
  workflow_dispatch:
  schedule:
  #         ┌───────────── minute (0 - 59)
  #         │  ┌───────────── hour (0 - 23)
  #         │  │ ┌───────────── day of the month (1 - 31)
  #         │  │ │ ┌───────────── month (1 - 12 or JAN-DEC)
  #         │  │ │ │ ┌───────────── day of the week (0 - 6 or SUN-SAT)
  #         *  * * * *
  - cron: "49 23 * * *" # 11min before utc midnight every day

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    if: |
      github.repository == 'IfcOpenShell/IfcOpenShell'
    outputs:
      version: ${{ steps.version.outputs.version }}
      date: ${{ steps.date.outputs.date }}
      verdate: ${{ steps.verdate.outputs.verdate }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set env
        run: echo ok go

      - name: Get current version
        id: version
        # Strip any trailing prerelease label and number; the dated alpha
        # suffix is added below.
        run: echo "version=$(sed -E 's/[[:alpha:]]+[0-9]+$//' VERSION)" >> $GITHUB_OUTPUT

      - name: Get current date
        id: date
        run: echo "date=$(date +'%y%m%d')" >> $GITHUB_OUTPUT

      - name: Version + date str
        id: verdate
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DATE: ${{ steps.date.outputs.date }}
        run: echo "verdate=${VERSION}alpha${DATE}" >> $GITHUB_OUTPUT


  publish:
    name: ${{ matrix.platform.distver }}-${{ matrix.pyver.name }}
    needs: resolve-version
    runs-on: ${{ matrix.platform.distver }}
    defaults:
      run:
        shell: bash -l {0}
    strategy:
      fail-fast: false
      matrix:
        pyver: [
          { name: py312, distver: '3.12'}
        ]
        platform: [
          { name: win, distver: windows-latest, pkg_dir: 'win-64' },
          { name: linux, distver: ubuntu-latest, pkg_dir: 'linux-64' },
          { name: macOS-arm, distver: macos-latest, pkg_dir: 'osx-arm64' }
        ]
    steps:
      - name: set ARTIFACTS ENV vars
        shell: bash
        run: |
          pwd
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            # Keep forward slashes - backslashes would break "upload to anaconda"
            # as bash would treat them as escape characters.
            echo "ARTIFACTS_DIR=D:/a/artifacts" >> $GITHUB_ENV
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            echo "ARTIFACTS_DIR=/Users/runner/work/artifacts" >> $GITHUB_ENV
          elif [[ "$RUNNER_OS" == "Linux" ]]; then
            echo "ARTIFACTS_DIR=/home/runner/work/artifacts" >> $GITHUB_ENV
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Download and extract MacOSX SDK
        if: ${{ matrix.platform.name == 'macOS-x86' }}
        run: |
          curl -L https://github.com/phracker/MacOSX-SDKs/releases/download/11.3/MacOSX10.13.sdk.tar.xz | tar -xvJf - -C /Users/runner/work/

      - uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3.2.1
        with:
          environment-name: test-env
          create-args: >-
            python=3.12
            anaconda-client
            rattler-build

      - name: ccache
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: conda-${{ matrix.platform.pkg_dir }}
          # By default it's installed from apt on Linux, ubuntu-latest is 24.04 with ccache 4.9,
          # too old for the job summary (needs 4.10+).
          install: binary

      - name: create conda package dist dir
        run: |
          mkdir -p ${ARTIFACTS_DIR}

      - name: build & test ifcopenshell
        run: |
          # `--no-build-id` keeps the build dir path stable between runs, needed for ccache.
          rattler-build build \
            --no-build-id \
            -r conda/recipe.yaml \
            --output-dir "${ARTIFACTS_DIR}"
        env:
          VERSION_OVERRIDE: ${{ needs.resolve-version.outputs.verdate }}

      - name: upload to anaconda
        run: |
          anaconda -t ${{ secrets.ANACONDA_TOKEN }} upload --force --user ifcopenshell ${ARTIFACTS_DIR}/${{ matrix.platform.pkg_dir }}/*.conda

  clean:
    needs: publish
    runs-on: ubuntu-latest
    env:
      ANACONDA_TOKEN: ${{ secrets.ANACONDA_TOKEN }}
      NUM_SUPPORTED_VERSIONS: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Run conda cleaner
        run: uv run --script conda/clean-old-versions.py
