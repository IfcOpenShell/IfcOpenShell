name: Release

on:
  push:
    tags:
      - 'v[0-9].[0-9].[0-9]*'
  workflow_dispatch:

jobs:
  upstream-only:
    if: github.repository == 'IfcOpenShell/IfcOpenShell'
    runs-on: ubuntu-22.04
    steps:
    - run: echo ok go
  release:
    needs: upstream-only
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install C++ dependencies
        run: |
          sudo apt update
          sudo apt-get install --no-install-recommends \
          git cmake gcc g++ \
          libboost-iostreams-dev \
          libboost-program-options-dev \
          libboost-regex-dev \
          python3-all-dev python3-pip \
          swig libpcre3-dev libxml2-dev \
          libtbb-dev nlohmann-json3-dev \
          libocct-foundation-dev libocct-modeling-algorithms-dev libocct-modeling-data-dev libocct-ocaf-dev libocct-visualization-dev libocct-data-exchange-dev \
          occt-misc libocct-draw-dev tcl-dev tk-dev libxi-dev \
          libcgal-dev libeigen3-dev

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2.24

      # TODO: reuse nix/build-all.py for this.
      - name: build swig
        run: |
          # Remove default swig to avoid conflicts.
          sudo apt remove --purge swig swig4.0
          sudo apt-get install -y libpcre2-dev bison
          git clone https://github.com/swig/swig --branch v4.2.1 --depth 1
          cd swig
          mkdir build && cd build
          cmake .. \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          sudo cmake --build . --target install -j $(nproc)

      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANGELOG_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir build && cd build
          cmake ../cmake \
           -G Ninja \
           -DCMAKE_INSTALL_PREFIX=$PWD/install/ \
           -DCMAKE_BUILD_TYPE=Release \
           "-DSCHEMA_VERSIONS=2x3;4;4x3_add2" \
           -DUSE_CCACHE=ON \
           -DBUILD_PACKAGE=On \
           -DPYTHON_EXECUTABLE:FILEPATH=$(which python) \
           -DPYTHON_INCLUDE_DIR:PATH=$(python -c "import sysconfig; print(sysconfig.get_path('include'))") \
           -DCOLLADA_SUPPORT=Off \
           -DBUILD_EXAMPLES=OFF \
           -DGLTF_SUPPORT=ON
          cmake --build . --target install -j $(nproc)
      - name: Package
        id: package
        run: |
          cmake --build . --target package
          echo ::set-output name=tgz::$( ls assets/*.tar.gz | head -n 1 | xargs basename )
          echo ::set-output name=deb::$( ls assets/*.deb | head -n 1 | xargs basename )
        working-directory: build
        env:
          CHANGELOG_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Release
        id: release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          draft: false
          prerelease: true
          body: |
            Changes to this release
              - add github actions support #1306
              - add boost depends to ifcopenshell deb packaging
              - <add more changes here>
            See more details in the documentation
#          body_path: build/CHANGELOG.md
      - name: Upload TGZ
        id: upload-tgz
        uses: actions/upload-release-asset@v1
        env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.release.outputs.upload_url }} # This pulls from the CREATE RELEASE step above, referencing it's ID to get its outputs object, which include a `upload_url`. See this blog post for more info: https://jasonet.co/posts/new-features-of-github-actions/#passing-data-to-future-steps
          asset_path: build/assets/${{ steps.package.outputs.tgz }}
          asset_name: ${{ steps.package.outputs.tgz }}
          asset_content_type: application/x-gzip
      - name: Upload DEB
        id: upload-deb
        uses: actions/upload-release-asset@v1
        env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.release.outputs.upload_url }} # This pulls from the CREATE RELEASE step above, referencing it's ID to get its outputs object, which include a `upload_url`. See this blog post for more info: https://jasonet.co/posts/new-features-of-github-actions/#passing-data-to-future-steps
          asset_path: build/assets/${{ steps.package.outputs.deb }}
          asset_name: ${{ steps.package.outputs.deb }}
          asset_content_type: application/vnd.debian.binary-package
