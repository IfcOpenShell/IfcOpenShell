name: Build IfcOpenShell Native WASM

permissions: {}

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Install Python
        # Installs latest Python version so it's preferred by uv over system Python.
        run: uv python install

      - name: Install Clang
        # The binding generator's `clang` bindings are pinned in pyproject.toml and
        # need a matching libclang, which is newer than the runner's distribution
        # Clang, so the LLVM repository's Clang is registered as the default one.
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          sudo add-apt-repository -y "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-21 main"
          sudo apt-get update
          sudo apt-get install -y clang-21 libclang-21-dev
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/lib/llvm-21/bin/clang++ 200

      - name: Set up Node
        # For the basic I/O tests, which drive the built artifacts through the
        # TypeScript API on Node.
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          path: IfcOpenShell
          persist-credentials: false

      - name: Checkout Build Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: IfcOpenShell/build-outputs
          path: ifcopenshell_build
          ref: wasm-native
          lfs: true
          token: ${{ secrets.BUILD_REPO_TOKEN }}
          persist-credentials: true

      - name: Read pinned emsdk version
        id: emsdk
        run: echo "version=$(jq -r .emsdk.version IfcOpenShell/nix/sources.lock.json)" >> "$GITHUB_OUTPUT"

      - name: Cache emsdk
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ifcopenshell_build/Linux/wasm/emsdk
          key: emsdk-${{ steps.emsdk.outputs.version }}-${{ runner.os }}

      - name: Unpack Dependencies
        run: |
          cd ifcopenshell_build
          uv run ../IfcOpenShell/nix/cache_dependencies.py unpack

      - name: ccache
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: ubuntu-22.04-${{ runner.arch }}-wasm-native
          # Distro ccache is < 4.10, too old for the job summary, install from GitHub releases.
          install: binary

      - name: Build
        env:
          # Keep the dependency install dir inside the cached repository, matching the pyodide flow.
          BUILD_DIR: ${{ github.workspace }}/ifcopenshell_build
        # `--with` provides the bindgen extra to the interpreter that cmake uses
        # to regenerate the C API bindings.
        run: uv run --with clang==21.1.7 ./IfcOpenShell/nix/build-all.py -v --native-wasm --build-cfg Release

      - name: Verify artifacts
        run: uv run IfcOpenShell/.github/scripts/verify-wasm-artifacts.py

      - name: Run the basic I/O tests
        # `tests/io.test.ts` is the port of `test/tests.py`; it runs against the
        # artifacts built above, through the `ifcopenshell` package on Node.
        env:
          IFCOPENSHELL_WASM_DIR: ${{ github.workspace }}/ifcopenshell_build/Linux/wasm/build/ifcopenshell/build/ifcwrap/wasm
        run: |
          cd IfcOpenShell/src/ts/ifcopenshell-wasm
          npm ci
          npm run stage
          cd ../ifcopenshell-js
          npm ci
          npm run build
          npm test -- tests/io.test.ts

      - name: Upload Build Logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-logs-native-wasm
          path: |
            ifcopenshell_build/*/*/logs/*.log
          retention-days: 30

      - name: Pack Dependencies
        run: |
          cd ifcopenshell_build
          uv run ../IfcOpenShell/nix/cache_dependencies.py pack

      - name: Commit and Push Changes to Build Repository
        run: |
          cd ifcopenshell_build
          git config user.name "IfcOpenBot"
          git config user.email "ifcopenbot@ifcopenshell.org"
          git add */*/install/cache-*.tar.gz
          git commit -m "Update build artifacts [skip ci]" || echo "No changes to commit"
          git push || echo "Push failed"

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ifcopenshell-native-wasm
          path: ifcopenshell_build/Linux/wasm/build/ifcopenshell/build/ifcwrap/wasm
          retention-days: 30
