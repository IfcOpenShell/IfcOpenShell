name: Build IfcOpenShell Native WASM

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Install Python
        # Installs latest Python version so it's preferred by uv over system Python.
        run: uv python install

      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          path: IfcOpenShell

      - name: Checkout Build Repository
        uses: actions/checkout@v7
        with:
          repository: IfcOpenShell/build-outputs
          path: ifcopenshell_build
          ref: wasm-native
          lfs: true
          token: ${{ secrets.BUILD_REPO_TOKEN }}

      - name: Read pinned emsdk version
        id: emsdk
        run: echo "version=$(jq -r .emsdk.version IfcOpenShell/nix/sources.lock.json)" >> "$GITHUB_OUTPUT"

      - name: Cache emsdk
        uses: actions/cache@v4
        with:
          path: ifcopenshell_build/Linux/wasm/emsdk
          key: emsdk-${{ steps.emsdk.outputs.version }}-${{ runner.os }}

      - name: Unpack Dependencies
        run: |
          cd ifcopenshell_build
          uv run ../IfcOpenShell/nix/cache_dependencies.py unpack

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: ubuntu-22.04-${{ runner.arch }}-wasm-native
          # Distro ccache is < 4.10, too old for the job summary, install from GitHub releases.
          install: binary

      - name: Build
        env:
          # Keep the dependency install dir inside the cached repository, matching the pyodide flow.
          BUILD_DIR: ${{ github.workspace }}/ifcopenshell_build
        run: uv run ./IfcOpenShell/nix/build-all.py -v --native-wasm --build-cfg Release

      - name: Verify artifacts
        run: |
          WASM_DIR=ifcopenshell_build/Linux/wasm/build/ifcopenshell/build/ifcwrap/wasm
          python3 - "$WASM_DIR" <<'PY'
          import json
          import sys
          from pathlib import Path

          wasm_dir = Path(sys.argv[1])

          expected = {
              "schema": ["ifc2x3", "ifc4", "ifc4x3_add2"],
              "kernel": ["passthrough", "opencascade", "cgal", "cgalsimple", "manifold"],
              "tree": ["opencascade.brep", "opencascade.trianglebvh"],
              "mapping": ["ifc2x3", "ifc4", "ifc4x3_add2"],
              "document": [
                  "xml.ifc2x3",
                  "json.ifc2x3",
                  "xml.ifc4",
                  "json.ifc4",
                  "xml.ifc4x3_add2",
                  "json.ifc4x3_add2",
              ],
              "geometry_serializer": ["ttl", "obj", "glb", "stp", "igs", "svg"],
          }

          artifacts = [
              "ifcopenshell_wasm.wasm",
              "ifcopenshell_wasm.mjs",
              "ifcopenshell_wasm.node.mjs",
              "ifcopenshell_api.mjs",
              "ifcopenshell_api.d.ts",
              "ifcopenshell_plugins.json",
          ]

          errors = []
          for name in artifacts:
              if not (wasm_dir / name).exists():
                  errors.append(f"missing artifact: {name}")

          manifest = json.loads((wasm_dir / "ifcopenshell_plugins.json").read_text())
          if set(manifest) != set(expected):
              errors.append(f"unexpected plugin kinds: {sorted(set(manifest) ^ set(expected))}")
          for kind, ids in expected.items():
              missing = set(ids) - set(manifest.get(kind, {}))
              unexpected = set(manifest.get(kind, {})) - set(ids)
              if missing:
                  errors.append(f"missing {kind} plugins: {sorted(missing)}")
              if unexpected:
                  errors.append(f"unexpected {kind} plugins: {sorted(unexpected)}")

          for entries in manifest.values():
              for entry in entries.values():
                  if not (wasm_dir / entry["wasm"]).exists():
                      errors.append(f"missing plugin artifact: {entry['wasm']}")

          if errors:
              for error in errors:
                  print(f"::error::{error}")
              sys.exit(1)
          print(f"Verified {len(artifacts)} artifacts and {sum(len(v) for v in manifest.values())} plugins.")
          PY

      - name: Upload Build Logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-logs-native-wasm
          path: |
            ifcopenshell_build/*/*/logs/*.log
          retention-days: 30

      - name: Pack Dependencies
        run: |
          cd ifcopenshell_build
          uv run ../IfcOpenShell/nix/cache_dependencies.py pack

      - name: Commit and Push Changes to Build Repository
        run: |
          cd ifcopenshell_build
          git config user.name "IfcOpenBot"
          git config user.email "ifcopenbot@ifcopenshell.org"
          git add */*/install/cache-*.tar.gz
          git commit -m "Update build artifacts [skip ci]" || echo "No changes to commit"
          git push || echo "Push failed"

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ifcopenshell-native-wasm
          path: ifcopenshell_build/Linux/wasm/build/ifcopenshell/build/ifcwrap/wasm
          retention-days: 30
