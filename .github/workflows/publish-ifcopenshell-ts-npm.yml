# This file was generated with the assistance of an AI coding tool.

name: Publish IfcOpenShell TypeScript npm

# Publishes the two npm packages of the TypeScript API:
#
#   @ifcopenshell/wasm  - the standalone WASM build (artifacts staged from CI)
#   ifcopenshell           - the ergonomic TypeScript/JavaScript wrapper
#
# `ifcopenshell` depends on `@ifcopenshell/wasm`, so the WASM package goes
# first. Both are published from one job because the wrapper's type checks read
# the staged artifacts through the workspace link rather than from the registry.
#
# With `transpiled`, `ifcopenshell` also ships ifcopenshell.util and
# ifcopenshell.api (`ifcopenshell/util/<module>`, `ifcopenshell/api/<package>`),
# transpiled from this checkout's Python source; they are not committed.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, for example 0.1.1. Defaults to the version in package.json.'
        required: false
        default: ''
      transpiled:
        description: 'Include ifcopenshell.util and ifcopenshell.api, transpiled from ifcopenshell-python.'
        type: boolean
        required: false
        default: false

permissions: {}

concurrency:
  group: publish-ts-npm
  cancel-in-progress: false

jobs:
  upstream-only:
    runs-on: ubuntu-latest
    if: |
      github.repository == 'IfcOpenShell/IfcOpenShell'
    steps:
      - name: Set env
        run: echo ok go

  publish:
    needs: upstream-only
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm trusted publishing and provenance attestations.
      id-token: write
    env:
      WASM_PACKAGE_DIR: src/ts/ifcopenshell-wasm
      TS_PACKAGE_DIR: src/ts/ifcopenshell-js
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Download the standalone WASM build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The WASM artifacts are not committed, so they come from the newest
          # successful standalone build rather than from a rebuild here.
          run_id="$(gh run list \
            --repo IfcOpenShell/IfcOpenShell \
            --workflow build-ifcopenshell-native-wasm.yml \
            --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          if [ -z "${run_id}" ]; then
            echo '::error::No successful standalone WASM build found, run build-ifcopenshell-native-wasm.yml first.'
            exit 1
          fi

          gh run download "${run_id}" \
            --repo IfcOpenShell/IfcOpenShell \
            --name ifcopenshell-native-wasm \
            --dir "${RUNNER_TEMP}/ifcopenshell-native-wasm"
          echo "IFCOPENSHELL_WASM_DIR=${RUNNER_TEMP}/ifcopenshell-native-wasm" >> "$GITHUB_ENV"

      - name: Stage the artifacts
        working-directory: ${{ env.WASM_PACKAGE_DIR }}
        run: |
          npm ci
          npm run stage

      - name: Set the version
        if: inputs.version != ''
        working-directory: ${{ env.WASM_PACKAGE_DIR }}
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: npm version "$RELEASE_VERSION" --no-git-tag-version --allow-same-version

      - name: Publish the WASM package
        working-directory: ${{ env.WASM_PACKAGE_DIR }}
        run: npm publish --provenance --access public

      - name: Set the TypeScript version and WASM dependency
        if: inputs.version != ''
        working-directory: ${{ env.TS_PACKAGE_DIR }}
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          npm version "$RELEASE_VERSION" --no-git-tag-version --allow-same-version
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const readJson = (path) => JSON.parse(readFileSync(path, 'utf8'));
          const wasm = readJson('../ifcopenshell-wasm/package.json');
          const pkg = readJson('package.json');
          const lock = readJson('package-lock.json');
          const range = `^${wasm.version}`;
          pkg.dependencies['@ifcopenshell/wasm'] = range;
          lock.packages[''].dependencies['@ifcopenshell/wasm'] = range;
          lock.packages['../ifcopenshell-wasm'].version = wasm.version;
          for (const [path, data] of [['package.json', pkg], ['package-lock.json', lock]]) {
            writeFileSync(path, JSON.stringify(data, null, 2) + '\n');
          }
          NODE

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: inputs.transpiled
        with:
          python-version: '3.13'

      - name: Transpile ifcopenshell.util and ifcopenshell.api
        if: inputs.transpiled
        run: |
          python -m pip install -r src/transpiler/requirements.txt
          python src/transpiler/generate.py

      - name: Build the TypeScript package
        working-directory: ${{ env.TS_PACKAGE_DIR }}
        run: |
          npm ci
          npm run build

      - name: Publish the TypeScript package
        working-directory: ${{ env.TS_PACKAGE_DIR }}
        run: npm publish --provenance --access public

