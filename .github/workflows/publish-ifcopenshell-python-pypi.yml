name: Publish IfcOpenShell Python PyPI

permissions: {}

on:
  workflow_dispatch:

env:
  major: 0
  minor: 0
  name: ifcopenshell

jobs:
  upstream-only:
    runs-on: ubuntu-latest
    if: |
      github.repository == 'IfcOpenShell/IfcOpenShell'
    steps:
    - name: Set env
      run: echo ok go

  publish:
    needs: upstream-only
    name: ${{ matrix.config.name }}-${{ matrix.pyver }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pyver: [py311, py312, py313, py314, py315]
        config:
          - {
            name: "Windows 64bit",
            short_name: win64,
          }
          - {
            name: "Windows ARM 64bit",
            short_name: win-arm64
          }
          - {
            name: "Linux 64bit",
            short_name: linux64
          }
          - {
            name: "Linux ARM 64bit",
            short_name: linuxarm64
          }
          - {
            name: "MacOS Intel 64bit",
            short_name: macos64
          }
          - {
            name: "MacOS Silicon 64bit",
            short_name: macosm164
          }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'
      - name: Compile
        run: |
          cp -r src/ifcopenshell-python src/ifcopenshell_${{ matrix.config.short_name }}_${{ matrix.pyver }} &&
          cd src/ifcopenshell_${{ matrix.config.short_name }}_${{ matrix.pyver }} &&
          make dist PLATFORM=${{ matrix.config.short_name }} PYVERSION=${{ matrix.pyver }} IS_STABLE=TRUE
      - name: Publish a Python distribution to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages_dir: src/ifcopenshell_${{ matrix.config.short_name }}_${{ matrix.pyver }}/dist
