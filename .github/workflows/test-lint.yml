name: Test Lint

permissions: {}

on:
  push:
    branches: [v0.9.0]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      MIN_IOS_PY_VERSION: "3.11"
      MIN_BLENDER_PY_VERSION: "3.11"
    steps:
      - name: Action - checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Action - install python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.MIN_IOS_PY_VERSION }}

      - name: Action - install python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.MIN_BLENDER_PY_VERSION }}

      - name: Action - setup uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Action - setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/ts/ifcopenshell-js/package-lock.json

      - name: Install TypeScript dependencies
        working-directory: src/ts/ifcopenshell-js
        run: npm ci

      - name: Install dependencies
        run: cat requirements-tools.txt | xargs -L1 uv tool install

      # The formatter doesn't catch all syntax errors, so we check them explicitly.
      - name: Check syntax errors
        id: syntax-errors
        run: |
          ERROR=0
          # Using 2 Python versions - one minimum required for IfcOpenShell
          # and other that's used by Blender currently.
          python${{ env.MIN_IOS_PY_VERSION }} -W error -m compileall -q src/ifcopenshell-python || ERROR=1
          python${{ env.MIN_BLENDER_PY_VERSION }} -W error -m compileall -q src/bonsai || ERROR=1
          exit $ERROR
        continue-on-error: true

      - name: Ruff format
        id: ruff-format
        run: |
          # Once for the GitHub annotations, once for the diff in the log.
          poe ruff-format --check --output-format=github || true
          poe ruff-format --check --diff
        continue-on-error: true

      - name: ty check (venv setup)
        run: poe ty-venv

      - name: ty check (bonsai)
        id: ty-bonsai
        run: poe ty-bonsai
        continue-on-error: true

      - name: ty check (ios)
        id: ty-ios
        run: poe ty-ios
        continue-on-error: true

      - name: Ruff check
        id: ruff
        run: |
          # Ensure execution continues, since we need to cache the output.
          set +e

          ERROR=0
          # Keep colored output inside action logs, strip it from color codes for summary.
          uv tool install ansi2txt
          # `ruff` disables color output in CI by default.
          export FORCE_COLOR="1"

          run_check() {
            local out
            out="$("$@" 2>&1)"
            local exit_code=$?

            if [ "$exit_code" -ne 0 ]; then
              ERROR=1
            fi

            # Rerun just for GitHub annotations.
            "$@" --output-format=github || true

            echo "$out"
            echo "\`\`\`python" >> $GITHUB_STEP_SUMMARY
            echo "$out" | ansi2txt >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          }

          run_check poe ruff

          exit $ERROR
        continue-on-error: true

      - name: Check whitespace
        id: check-whitespace
        run: poe check-whitespace --check
        continue-on-error: true

      - name: ESLint (TypeScript)
        id: ts-eslint
        working-directory: src/ts/ifcopenshell-js
        run: npm run lint
        continue-on-error: true

      - name: zizmor
        id: zizmor
        run: |
          # Once for the GitHub annotations, once for the readable output in the log.
          poe zizmor --format=github || true
          poe zizmor
        continue-on-error: true

      - name: Check VERSION
        id: check-version
        run: poe version
        continue-on-error: true

      - name: Final check
        run: |
          ERROR=0
          if [ "${{ steps.syntax-errors.outcome }}" != "success" ]; then
            echo "::error::Syntax errors check failed, see 'syntax-errors' step for the details." && ERROR=1
          fi
          if [ "${{ steps.ruff-format.outcome }}" != "success" ]; then
            echo "::error::Ruff format check failed, see 'Ruff format' step for the details." && ERROR=1
          fi
          if [ "${{ steps.ruff.outcome }}" != "success" ]; then
            echo "::error::Ruff check failed, see Summary or 'ruff' step for the details." && ERROR=1
          fi
          if [ "${{ steps.ty-bonsai.outcome }}" != "success" ]; then
            echo "::error::ty check (bonsai) failed, see 'ty check (bonsai)' step for the details." && ERROR=1
          fi
          if [ "${{ steps.ty-ios.outcome }}" != "success" ]; then
            echo "::error::ty check (ios) failed, see 'ty check (ios)' step for the details." && ERROR=1
          fi
          if [ "${{ steps.check-whitespace.outcome }}" != "success" ]; then
            echo "::error::Whitespace check failed, see 'Check whitespace' step for the details." && ERROR=1
          fi
          if [ "${{ steps.ts-eslint.outcome }}" != "success" ]; then
            echo "::error::ESLint (TypeScript) failed, see 'ESLint (TypeScript)' step for the details." && ERROR=1
          fi
          if [ "${{ steps.zizmor.outcome }}" != "success" ]; then
            echo "::error::zizmor (GitHub workflows security check) failed, see 'zizmor' step for the details." && ERROR=1
          fi
          if [ "${{ steps.check-version.outcome }}" != "success" ]; then
            echo "::error::VERSION check failed, see 'Check VERSION' step for the details." && ERROR=1
          fi
          exit $ERROR
