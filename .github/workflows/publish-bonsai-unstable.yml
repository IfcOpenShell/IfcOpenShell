name: Publish Bonsai Unstable

permissions: {}

on:
  push:
    paths:
      - '.github/workflows/publish-bonsai-unstable.yml'
      - 'src/bonsai/**'
      - 'src/ifcopenshell-python/ifcopenshell/**'
      - 'src/bcf/bcf/**'
      - 'src/ifcclash/ifcclash/**'
      - 'src/ifccobie/**'
      - 'src/ifcdiff/**'
      - 'src/ifccsv/**'
      - 'src/ifcpatch/ifcpatch/**'
      - 'src/ifc4d/ifc4d/**'
      - 'src/ifc5d/ifc5d/**'
      - 'src/ifccityjson/**'
    branches:
      - v0.9.0
  workflow_dispatch:

# Runs queue behind each other instead of overlapping: cancelling one mid-publish
# would leave a release with some of its zips missing.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  BLENDER_VERSION: 5.2.0

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      # Create the release.
      contents: write
    if: |
      github.repository == 'IfcOpenShell/IfcOpenShell'
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Create release
      id: release
      env:
        GH_TOKEN: ${{ github.token }}
      # Include hours and minutes to release tag
      # to avoid possibility of unstable repo's index.json
      # pointing to the new file when index.json itself wasn't yet updated.
      run: |
        VERSION=$(sed -E 's/[[:alpha:]]+[0-9]+$//' VERSION)
        TAG="bonsai-$VERSION-alpha$(date +'%y%m%d%H%M')"
        echo "tag=$TAG" >> $GITHUB_OUTPUT
        gh release view "$TAG" || gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG (unstable)" \
          --notes "See README in https://github.com/IfcOpenShell/bonsai_unstable_repo/ on how to setup autoupdates for daily Bonsai builds."

  build:
    needs: release
    name: ${{ matrix.config.name }}-${{ matrix.pyver }}
    runs-on: ubuntu-latest
    permissions:
      # upload-release-action uploads assets
      contents: write
    strategy:
      fail-fast: false
      matrix:
        pyver: [py311, py313]
        config:
          - {
            name: "Windows Build",
            short_name: win,
          }
          - {
            name: "Linux Build",
            short_name: linux,
          }
          - {
            name: "MacOS ARM Build",
            short_name: macosm1,
          }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Install lbzip2
        run: sudo apt-get install -y lbzip2
      - name: Compile
        run: |
          cd src/bonsai && make dist PLATFORM=${{ matrix.config.short_name }} PYVERSION=${{ matrix.pyver }}
      - name: Find zip file name
        id: find_zip
        run: |
          filepath=$(ls src/bonsai/dist/bonsai_*.zip)
          echo "filepath=$filepath" >> $GITHUB_OUTPUT
          echo "filename=$(basename $filepath)" >> $GITHUB_OUTPUT
      - name: Upload zip file to release
        uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # 2.11.5
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ steps.find_zip.outputs.filepath }}
          asset_name: ${{ steps.find_zip.outputs.filename }}
          tag: ${{ needs.release.outputs.tag }}
          overwrite: true

  publish:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bonsai_unstable_repo repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: IfcOpenShell/bonsai_unstable_repo
          token: ${{ secrets.IFCOPENBOT_TOKEN }}
          path: bonsai_unstable_repo
          persist-credentials: true

      - name: Download Blender
        # The index script runs `blender --command extension server-generate`, so blender must be on PATH.
        run: |
          wget -q -O blender.tar.xz "https://download.blender.org/release/Blender${BLENDER_VERSION%.*}/blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          tar -xf blender.tar.xz
          echo "$(readlink -f blender-*/)" >> "$GITHUB_PATH"

      - name: Update index.json on extensions repo
        # Pulls the zips of the release published above and regenerates the
        # extension index. Testing the build happens in test-bonsai.yml.
        run: |
          set -x -e
          blender --version

          cd bonsai_unstable_repo
          pip install -r requirements.txt
          python setup_extensions_repo.py --last-tag

          git config --global user.name 'IfcOpenBot'
          git config --global user.email 'IfcOpenBot@users.noreply.github.com'
          git add index.json
          git add readme.md
          git commit -m "Update index.json"
          git push
