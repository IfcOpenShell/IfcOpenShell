name: ci-black-formatting

on:
  push:
  pull_request:

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint-formatting:
    runs-on: ubuntu-latest
    steps:
      - name: Action - checkout repository
        uses: actions/checkout@v4.2.2

      # NOTE: This fails if anything changes via the prettifier as opposed to just on linting errors!
      # - name: QA Step - run linter
      #   uses: psf/black@24.10.0

      - name: Action - install python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: "${{ env.PYTHON_VERSION }}"

      - name: Step 1 - install dependencies
        shell: bash
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install 'black>=24.10.0'

      - name: QA Step - check linting
        shell: bash
        id: linting
        run: |
          python3 -m black --check . \
          && exit 0 \
          || (echo "exit_code=$?" >> "$GITHUB_OUTPUT" && exit 1);
        continue-on-error: true

      # LINTING HAS ALREADY BEEN RUN
      - name: QA Step - no linting errors
        if: steps.linting.outcome == 'success'
        shell: bash
        run: |-
          echo "::notice::QA step linting succeeded"
          exit 0;

      # LINTING HAS NOT BEEN RUN BUT CONTAINS NO ERRORS
      - name: QA Step - no linting errors but needs linting
        if: steps.linting.outputs.exit_code == 1
        shell: bash
        run: |-
          echo "::group::QA step linting succeeded with warnings"
          echo "::warning::please run the linter before pushing!";
          echo "::endgroup::"
          exit 0;

      # LINTING FAILED
      - name: QA Step - linting errors
        if: steps.linting.outputs.exit_code == 123
        shell: bash
        run: |-
          echo "::group::QA step linting failed"
          echo "::error::please run the linter and fix syntax errors before pushing!";
          echo "::endgroup::"
          exit 1;
