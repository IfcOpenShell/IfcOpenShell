name: Publish Bonsai Releases

permissions: {}

on:
  workflow_dispatch:
    # Can be removed when issue below is resolved
    # https://projects.blender.org/infrastructure/extensions-website/issues/429
    inputs:
      only_py311:
        description: "Publish only the py311 zips (e.g. later, after the new version upload cooldown)"
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Publish to Blender Extensions
        run: |
          if [ "${{ inputs.only_py311 }}" != "true" ]; then
            uv run .github/scripts/publish-bonsai-releases.py --python-version py313
          fi
          uv run .github/scripts/publish-bonsai-releases.py --python-version py311 || {
            echo "::error::Failed to publish py311 zips, likely because of the 2h new version upload cooldown" \
              "(see the response above). Rerun later with only_py311."
            exit 1
          }
        env:
          BLENDER_EXTENSIONS_TOKEN: ${{ secrets.BLENDER_EXTENSIONS_TOKEN }}
