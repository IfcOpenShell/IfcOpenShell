name: Build IfcOpenShell

permissions: {}

on:
  workflow_dispatch:
    inputs:
      only-common-schemas:
        description: Build only common IFC schemas
        type: boolean
        default: true

jobs:
  dispatch:
    runs-on: ubuntu-latest
    permissions:
      # Needed for dispatching workflows by `gh workflow run`.
      actions: write
    steps:
      - name: Trigger binary build workflows
        env:
          GH_TOKEN: ${{ github.token }}
          ONLY_COMMON_SCHEMAS: ${{ inputs.only-common-schemas }}
        run: |
          workflows=(
            build-ifcopenshell-linux.yml
            build-ifcopenshell-macos.yml
            build-ifcopenshell-wasm.yml
            build-ifcopenshell-windows.yml
          )
          for workflow in "${workflows[@]}"; do
            gh workflow run "$workflow" --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f only-common-schemas="$ONLY_COMMON_SCHEMAS"
          done
