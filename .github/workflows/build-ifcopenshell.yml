name: Build IfcOpenShell

on:
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger binary build workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          workflows=(
            build-ifcopenshell-linux.yml
            build-ifcopenshell-macos.yml
            build-ifcopenshell-wasm.yml
            build-ifcopenshell-windows.yml
          )
          for workflow in "${workflows[@]}"; do
            gh workflow run "$workflow" --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
          done
