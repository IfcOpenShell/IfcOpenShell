name: Build IfcOpenShell Windows ARM64

on:
  workflow_dispatch:

jobs:
  build_ifcopenshell:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runs_on: windows-2022
            deps_dir: _deps-vs2022-x64-installed
            cmake_triplet: vs2022-x64
            vcvars: '"C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"'
            build_repo: qcom-eng-691/IfcOpenShell-build-outputs
            build_branch: windows-x64
            zip_suffix: win64
            do_s3: false
            git_name: tsomanna_QCOM
            git_email: tsomanna@qti.qualcomm.com

          - arch: ARM64
            runs_on: windows-11-arm     # your self-hosted label
            deps_dir: _deps-vs2022-ARM64-installed
            cmake_triplet: vs2022-ARM64
            vcvars: '"C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsarm64.bat"'
            build_repo: qcom-eng-691/IfcOpenShell-build-outputs
            build_branch: windows-arm64
            zip_suffix: win-arm64
            do_s3: false
            git_name: tsomanna_QCOM
            git_email: tsomanna@qti.qualcomm.com

    runs-on: ${{ matrix.runs_on }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Checkout Build Repository
        uses: actions/checkout@v6
        with:
          repository: ${{ matrix.build_repo }}
          path: ${{ matrix.deps_dir }}
          ref: ${{ matrix.build_branch }}
          lfs: true
          token: ${{ secrets.BUILD_REPO_TOKEN }}

      - name: Install Dependencies
        run: |
          choco install -y sed 7zip.install awscli

      - name: Unpack Dependencies
        run: |
          cd ${{ matrix.deps_dir }}
          Get-ChildItem -Path . -Filter 'cache-*.zip' | ForEach-Object {
            7z x $_.FullName
          }

      - name: Run Build Script And Pack .zip Archives
        shell: cmd
        env:
          TARGET_ARCH: ${{ matrix.arch }}  # lets the Python script know which arch to target (optional override)
        run: |
          call ${{ matrix.vcvars }}
          set CMAKE_POLICY_VERSION_MINIMUM=3.5
          set CMAKE_INTERPROCEDURAL_OPTIMIZATION=OFF
          set CMAKE_MSVC_DEBUG_INFORMATION_FORMAT=ProgramDatabase
          cd win
          rem Unified script that autodetects arch or uses TARGET_ARCH
          python build-all-win.py

      - name: Pack Dependencies
        run: |
          cd ${{ matrix.deps_dir }}
          Get-ChildItem -Path . -Directory | ForEach-Object {
            $cacheFile = "cache-$($_.Name).zip"
            echo $cacheFile
            if (!(Test-Path $cacheFile)) {
              7z a $cacheFile $_.FullName
            }
          }

      - name: Commit and Push Changes to Build Repository
        run: |
          cd _deps-vs2022-ARM64-installed
          git lfs install
          git lfs track "*.zip"
          git add .gitattributes
          git commit -m "Track cache ZIPs with LFS" 2>$null || echo "gitattributes unchanged"
          git add --renormalize .
          git lfs ls-files || echo "No LFS-tracked files yet"
          git config user.name "tsomanna_QCOM"
          git config user.email "tsomanna@qti.qualcomm.com"
          git checkout -B windows-arm64
          git add *.zip
          git commit -m "Update ARM64 build caches [skip ci]" || echo "No changes to commit"
          git push --set-upstream origin windows-arm64 || echo "Push failed"

