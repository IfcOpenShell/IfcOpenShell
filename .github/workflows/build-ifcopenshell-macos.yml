name: Build IfcOpenShell macOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos
            runner: macos-15-intel
            arch: x64
            oldarch: ""
            without: -without-bonsaiviewer
            test_args: --skip-bonsaiviewer
          - os: macos
            # macos-14 no longer receives Homebrew bottles, so `brew install qt`
            # compiles Qt (and QtWebEngine) from source there and fails.
            runner: macos-15
            arch: arm64
            oldarch: m1
            without: ""
            test_args: ""

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Checkout Build Repository
        uses: actions/checkout@v7
        with:
          repository: IfcOpenShell/build-outputs
          path: ./build
          ref: ${{ matrix.os }}-${{ matrix.arch }}
          lfs: true
          token: ${{ secrets.BUILD_REPO_TOKEN }}

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Install Dependencies
        run: |
          brew update
          # preinstalled: xz, cmake
          brew install git bison autoconf automake libffi findutils
          # qt brings in Qt6 + Svg; nix/build-all.py honours pre-set
          # QT_DIR so BonsaiViewer doesn't try to aqtinstall (which is
          # Linux-only). Only the viewer needs it.
          if [ "${{ matrix.arch }}" == "arm64" ]; then
            brew install qt
          fi
          echo "$(brew --prefix findutils)/libexec/gnubin" >> $GITHUB_PATH
          # Mac is using bison 2.5 by default, but we need 3.5+ for swig.
          echo "$(brew --prefix bison)/bin" >> $GITHUB_PATH

      # The bonsaiviewer-autodesk connector is a Rust crate; the "Package
      # .zip archives" step below runs `cargo build --release` via
      # packaging/build.py. Match the dedicated connector workflow's stable
      # toolchain, rather than whatever Rust the runner image happens to ship.
      - uses: dtolnay/rust-toolchain@stable

      - name: Install aws cli
        run: |
          python -m pip install awscli

      - name: Unpack Dependencies
        run: |
          cd build
          uv run ../nix/cache_dependencies.py unpack

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: mac-${{ matrix.arch }}
          # No Intel bottle in brew, so use the prebuilt release binary.
          # See https://github.com/hendrikmuhs/ccache-action/issues/374
          install: ${{ matrix.arch == 'x64' && 'binary' || 'detect' }}

      - name: Run Build Script
        shell: bash
        run: |
          if [ "${{ matrix.os }}" == "macos" ]; then
            DARWIN_C_SOURCE=-D_DARWIN_C_SOURCE
          fi
          set -o pipefail
          if [ "${{ matrix.arch }}" == "arm64" ]; then
            export QT_DIR="$(brew --prefix qt)"
          fi
          CXXFLAGS="-O3" CFLAGS="-O3 ${DARWIN_C_SOURCE}" \
            QT_DIR="${QT_DIR}" \
            uv run ./nix/build-all.py \
              -v \
              --diskcleanup \
              --shared \
              --add-commit-sha \
              --build-cfg Release \
              --use-ninja \
              ${{ matrix.without }} \
            | tee build.log

      - name: Upload Build Logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-logs-osx-${{ matrix.arch }}
          path: |
            build.log
            build/*/*/*/logs/*.log
            build/*/*/*/build/ifcopenshell/**/CMakeCache.txt
          retention-days: 30

      - name: Pack Dependencies
        run: |
          cd build
          uv run ../nix/cache_dependencies.py pack

      - name: Commit and Push Changes to Build Repository
        run: |
          cd build
          git config user.name "IfcOpenBot"
          git config user.email "ifcopenbot@ifcopenshell.org"
          git add "$(find . -maxdepth 4 -name install)/*.tar.gz"
          git commit -m "Update build artifacts [skip ci]" || echo "No changes to commit"
          git push || true

      - name: Package .zip archives
        run: |
          uv run nix/package-zip-archives.py "macos${{ matrix.oldarch }}64"

      - name: Test packages
        run: |
          uv run test/package/run_against_package.py ${{ matrix.test_args }} "$HOME/output"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_UPLOAD_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_UPLOAD_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Upload .zip archives to S3
        run: |
          aws s3 cp ~/output s3://ifcopenshell-builds/ --recursive
