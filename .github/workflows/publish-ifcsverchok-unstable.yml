name: Publish IfcSverchok Unstable

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/publish-ifcsverchok-unstable.yml'
      - 'src/ifcsverchok/*'
    branches:
      - v0.9.0

jobs:
  upstream-only:
    runs-on: ubuntu-latest
    if: |
      github.repository == 'IfcOpenShell/IfcOpenShell'
    steps:
    - name: Set env
      run: echo ok go

  publish:
    needs: upstream-only
    name: ifcsverchok
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Get current version
        id: version
        run: echo "version=$(sed -E 's/[[:alpha:]]+[0-9]+$//' VERSION)" >> $GITHUB_OUTPUT
      - name: Get current date
        id: date
        run: echo "date=$(date +'%y%m%d')" >> $GITHUB_OUTPUT
      - name: Compile
        run: |
          cd src/ifcsverchok
          make dist
      - name: Upload zip file to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: src/ifcsverchok/dist/ifcsverchok-${{steps.version.outputs.version}}.${{steps.date.outputs.date}}.zip
          asset_name: ifcsverchok-${{steps.version.outputs.version}}.${{steps.date.outputs.date}}.zip
          release_name: "ifcsverchok-${{steps.version.outputs.version}}.${{steps.date.outputs.date}} (unstable)"
          tag: "ifcsverchok-${{steps.version.outputs.version}}.${{steps.date.outputs.date}}"
          overwrite: true
