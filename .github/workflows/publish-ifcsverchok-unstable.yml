name: Publish IfcSverchok Unstable

permissions: {}

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/publish-ifcsverchok-unstable.yml'
      - 'src/ifcsverchok/*'
    branches:
      - v0.9.0

jobs:
  upstream-only:
    runs-on: ubuntu-latest
    if: |
      github.repository == 'IfcOpenShell/IfcOpenShell'
    steps:
    - name: Set env
      run: echo ok go

  publish:
    needs: upstream-only
    name: ifcsverchok
    runs-on: ubuntu-latest
    permissions:
      # upload-release-action creates the release and uploads assets
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Get current version
        id: version
        run: echo "version=$(sed -E 's/[[:alpha:]]+[0-9]+$//' VERSION)" >> $GITHUB_OUTPUT
      - name: Get current date
        id: date
        run: echo "date=$(date +'%y%m%d')" >> $GITHUB_OUTPUT
      - name: Compile
        run: |
          cd src/ifcsverchok
          make dist
      - name: Upload zip file to release
        uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # 2.11.5
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: src/ifcsverchok/dist/ifcsverchok-${{steps.version.outputs.version}}.${{steps.date.outputs.date}}.zip
          asset_name: ifcsverchok-${{steps.version.outputs.version}}.${{steps.date.outputs.date}}.zip
          release_name: "ifcsverchok-${{steps.version.outputs.version}}.${{steps.date.outputs.date}} (unstable)"
          tag: "ifcsverchok-${{steps.version.outputs.version}}.${{steps.date.outputs.date}}"
          target_commit: ${{ github.sha }}
          overwrite: true
