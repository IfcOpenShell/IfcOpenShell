name: Build IfcOpenShell Windows

permissions: {}

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runs_on: windows-2022
            deps_dir: _deps-vs2022-x64-installed
            vcvars: '"C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"'
            build_branch: windows-x64
            zip_suffix: win64

          - arch: ARM64
            runs_on: windows-11-arm
            deps_dir: _deps-vs2026-ARM64-installed
            vcvars: '"C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Auxiliary\Build\vcvarsarm64.bat"'
            build_branch: windows-arm64-vs2026
            zip_suffix: win-arm64

    runs-on: ${{ matrix.runs_on }}

    steps:
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Checkout Build Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: IfcOpenShell/build-outputs
          path: ${{ matrix.deps_dir }}
          ref: ${{ matrix.build_branch }}
          lfs: true
          token: ${{ secrets.BUILD_REPO_TOKEN }}
          persist-credentials: true

      - name: Install Dependencies
        run: |
          choco install -y sed 7zip.install

      - name: Unpack Dependencies
        run: |
          cd ${{ matrix.deps_dir }}
          Get-ChildItem -Path . -Filter 'cache-*.zip' | ForEach-Object {
            Write-Host "Extracting $($_.Name)"
            7z x -bso0 -bsp0 $_.FullName
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to extract $($_.Name) with 7z exit code $LASTEXITCODE."
            }
          }

      - name: ccache
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: win-${{ matrix.arch }}
          # Windows ccache needs ~1GB
          # and with default 500MB some cache gets deleted, leading to misses.
          max-size: 5000MB

      - name: Run Build Script And Pack .zip Archives
        shell: cmd # zizmor: ignore[misfeature] needed for vcvars environment
        run: |
          call ${{ matrix.vcvars }}
          cd win
          uv run build-all-win.py --split-instance-builds

      - name: Pack Dependencies
        run: |
          cd ${{ matrix.deps_dir }}
          Get-ChildItem -Path . -Directory | ForEach-Object {
            $cacheFile = "cache-$($_.Name).zip"
            echo $cacheFile
            if (!(Test-Path $cacheFile)) {
              7z a $cacheFile $_.FullName
            }
          }

      - name: Commit and Push Changes to Build Repository
        run: |
          cd ${{ matrix.deps_dir }}
          git config user.name "IfcOpenBot"
          git config user.email "ifcopenbot@ifcopenshell.org"
          git checkout -B ${{ matrix.build_branch }}
          git add *.zip
          git commit -m "Update build artifacts [skip ci]" || echo "No changes to commit"
          git push --set-upstream origin ${{ matrix.build_branch }} || echo "Push failed"

      - name: Test packages
        # Runs after the dependency cache is pushed, so a failing package never
        # costs the cache.
        env:
          # Colored output for pytest.
          FORCE_COLOR: 1
        run: |
          uv run test/package/run_against_package.py "$env:USERPROFILE\output"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_UPLOAD_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_UPLOAD_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # AWS CLI is preinstalled on the runner image.
      - name: Upload .zip Archives to S3
        env:
          AWS_DEBUG: 1
          AWS_RETRY_MODE: standard
          AWS_MAX_ATTEMPTS: 3
        run: |
          dir "$env:USERPROFILE\output"
          foreach ($zip in Get-ChildItem -Path "$env:USERPROFILE\output" -Filter *.zip) {
              aws s3 cp "$($zip.FullName)" s3://ifcopenshell-builds/ --debug
              Start-Sleep -Seconds 5
          }
