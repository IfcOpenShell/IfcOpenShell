name: Publish Bonsai Chocolatey

on:
  schedule:
    #         ┌───────────── minute (0 - 59)
    #         │  ┌───────────── hour (0 - 23)
    #         │  │ ┌───────────── day of the month (1 - 31)
    #         │  │ │ ┌───────────── month (1 - 12 or JAN-DEC)
    #         │  │ │ │ ┌───────────── day of the week (0 - 6 or SUN-SAT)
    #         *  * * * *
    - cron:  "30 0 * * *" # 30min past utc midnight
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to package (default: yesterday's newest nightly)"
        required: false
      dry_run:
        description: "Pack only, do not push to chocolatey.org"
        type: boolean
        default: false

jobs:
  upstream-only:
    runs-on: ubuntu-latest
    if: |
      github.repository == 'IfcOpenShell/IfcOpenShell'
    steps:
    - name: Set env
      run: echo ok go

  publish:
    needs: upstream-only
    name: "choco_release"
    # choco is preinstalled on the Windows runners.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Pack the nightly and push it
        env:
          CHOCO_TOKEN: ${{ secrets.CHOCO_TOKEN }}
        run: >
          uv run choco/bonsai/choco_release.py
          ${{ inputs.tag && format('--tag {0}', inputs.tag) || '' }}
          ${{ inputs.dry_run && '--dry-run' || '' }}
      - uses: actions/upload-artifact@v7
        with:
          name: bonsai-nightly-nupkg
          path: choco/bonsai/dist/*.nupkg
