name: Build IfcOpenShell WASM

permissions: {}

on:
  workflow_dispatch:
    inputs:
      only-common-schemas:
        description: Build only common IFC schemas
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Install Python
        # Installs latest Python version so it's preferred by uv over system Python.
        run: uv python install

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          path: IfcOpenShell
          persist-credentials: false

      - name: Checkout Build Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: IfcOpenShell/build-outputs
          path: ifcopenshell_build
          ref: wasm
          lfs: true
          token: ${{ secrets.BUILD_REPO_TOKEN }}
          persist-credentials: true

      - name: Unpack Dependencies
        run: |
          cd ifcopenshell_build
          uv run ../IfcOpenShell/nix/cache_dependencies.py unpack

      - name: ccache
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: ubuntu-22.04-${{ runner.arch }}
          # Distro ccache is < 4.10, too old for the job summary, install from GitHub releases.
          install: binary

      - name: Build
        env:
          BUILD_ONLY_COMMON_SCHEMAS: ${{ inputs.only-common-schemas && 'ON' || 'OFF' }}
        run: |
          ./IfcOpenShell/pyodide/build_pyodide.sh
          FILE=`echo dist/ifcopenshell-*.whl`
          NEW_FILE=`echo $FILE | sed "s/-/+${GITHUB_SHA:0:7}-/2"`
          mv $FILE $NEW_FILE

      - name: Upload Build Logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-logs-pyodide
          path: |
            ifcopenshell_build/*/*/logs/latest.log
          retention-days: 30

      - name: Pack Dependencies
        run: |
          cd ifcopenshell_build
          uv run ../IfcOpenShell/nix/cache_dependencies.py pack

      - name: Commit and Push Changes to Build Repository
        run: |
          cd ifcopenshell_build
          git config user.name "IfcOpenBot"
          git config user.email "ifcopenbot@ifcopenshell.org"
          git add */*/install/cache-*.tar.gz
          git commit -m "Update build artifacts [skip ci]" || echo "No changes to commit"
          git push || echo "Push failed"

      - name: Order wheel shared objects
        run: |
          uv run ./IfcOpenShell/pyodide/order_pyodide_wheel_shared_objects.py dist/ifcopenshell-*.whl

      - name: Split packages
        run: |
          VERSION=v`cat ./IfcOpenShell/VERSION`
          mkdir -p dist-modular
          uv run ./IfcOpenShell/pyodide/split_pyodide_ifcopenshell_wheel.py dist/ifcopenshell-*.whl ./dist-modular
          cd dist-modular
          zip -r -qq ifcopenshell-modular-${VERSION}-${GITHUB_SHA:0:7}-pyodide.zip *.whl

      - name: Verify create_shape in monolithic and modular wheels
        run: |
          source .venv/bin/activate
          PYODIDE_ROOT=$(pyodide config get pyodide_root)
          node IfcOpenShell/pyodide/verify_wheels.mjs "$PYODIDE_ROOT/dist" dist dist-modular

      - name: Run wheel tests
        run: |
          # venv set up in build_pyodide.sh.
          source .venv/bin/activate
          ln -s "$PWD/dist" IfcOpenShell/dist
          ln -s "$PWD/dist-modular" IfcOpenShell/dist-modular
          cd IfcOpenShell/pyodide
          ./run_pytest.py setup
          ./run_pytest.py run

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_UPLOAD_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_UPLOAD_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # AWS CLI is preinstalled on the runner image.
      - name: Upload .zip archives to S3
        run: |
          aws s3 cp dist s3://ifcopenshell-builds/ --recursive --exclude "*" --include "*.whl"
          aws s3 cp dist-modular s3://ifcopenshell-builds/ --recursive --exclude "*" --include "*.zip"
